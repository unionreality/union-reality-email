spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: emailService
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:sales@unionrealityandconstructions.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

server:
  port: ${PORT:${SERVER_PORT:8080}}

email-service:
  from-address: ${MAIL_FROM:sales@unionrealityandconstructions.com}
  from-name: ${MAIL_FROM_NAME:Union Reality and Constructions}
  cc-addresses: ${MAIL_CC:accounts@unionrealityandconstructions.com}
  bcc-chaitra: ${MAIL_BCC_CHAITRA:chaitra@unionrealityandconstructions.com}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.unionrealityandconstructions.com,https://unionrealityandconstructions.com,http://localhost:5173,http://localhost:3000}
  email-subject-prefix: ${EMAIL_SUBJECT_PREFIX:Booking confirmation}
  contact:
    website-url: ${CONTACT_WEBSITE_URL:https://www.unionrealityandconstructions.com/}
    whatsapp-url: ${CONTACT_WHATSAPP_URL:https://wa.me/918217341627}
    maps-url: ${CONTACT_MAPS_URL:https://maps.app.goo.gl/xWvbFLRsqqGiX3Dh9}
    phone-display: ${CONTACT_PHONE:+91 82173 41627}
    sales-email: ${CONTACT_SALES_EMAIL:sales@unionrealityandconstructions.com}
    postal-line-1: No 6, MCH complex,
    postal-line-2: Dasanapura Hobli,
    postal-line-3: Huskur Road,
    postal-line-4: Bangalore 562162.
  receipt:
    company-name: Union Reality and Constructions
    company-address: No. 6, MCH Complex, Dasanpura Hobli, Huskur Road, Bengaluru 562162
    company-phone: "+91 82173 41627/99010 79241"
    company-email: sales@unionrealityandconstructions.com
    company-gstin: ${COMPANY_GSTIN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
